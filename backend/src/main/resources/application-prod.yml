# prodではlocalの.envを読み込まず、実行環境に設定した値を必須とする。
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  lifecycle:
    timeout-per-shutdown-phase: 35s
  flyway:
    # DBサービスの起動待ちだけを再試行する。外部価格取得の再試行は変更しない。
    connect-retries: 10
    connect-retries-interval: 5s

server:
  address: 0.0.0.0
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-exception: false
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
    jmx:
      exposure:
        exclude: '*'
  endpoint:
    health:
      show-details: never
      show-components: never
