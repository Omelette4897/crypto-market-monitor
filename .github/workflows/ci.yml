name: CI

# 作業ブランチへのpushだけでは重複実行せず、PRとmainへの取り込みを検証する。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# CIはコードの読取りだけ。リポジトリへの書込み・公開・デプロイは行わない。
permissions:
  contents: read

# 同じPR/ブランチに新しい変更が来たら、古い実行を止めて待ち時間を抑える。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          overwrite-settings: false
      - name: Check Docker availability
        run: docker version
      # Testcontainersが専用MySQLを作成・破棄する。開発DB/.env/実Coinbaseは使わない。
      # verifyの中で通常テスト→JAR作成→DB結合テストを実行し、失敗をそのままCI失敗とする。
      - name: Test and build backend with MySQL integration tests
        run: ./mvnw --batch-mode --no-transfer-progress -Pmysql-it -DfailIfNoTests=true verify

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: npm ci
      - name: Test frontend
        run: npm test
      # buildスクリプトはvue-tscの型チェックとViteの本番ビルドを含む。
      - name: Typecheck and build frontend
        run: npm run build
