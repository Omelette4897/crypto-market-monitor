name: crypto-market-monitor

services:
  mysql:
    image: mysql:8.4.13
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Run node scripts/init-local-env.mjs first}
      MYSQL_USER: ${DB_USER:?Missing DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Missing DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Missing MYSQL_ROOT_PASSWORD}
      TZ: UTC
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP --host=127.0.0.1 --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}" --execute="SELECT 1" >/dev/null 2>&1'
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

volumes:
  mysql-data:
